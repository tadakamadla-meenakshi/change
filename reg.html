<!DOCTYPE html>
<html>
<head>
    <title>Event Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h2>Event Registration Form</h2>

    <form onsubmit="return validateForm()">

        <label>First Name:</label>
        <input type="text" id="fname"><br><br>

        <label>Last Name:</label>
        <input type="text" id="lname"><br><br>

        <label>Date of Birth:</label>
        <input type="date" id="dob"><br><br>

        <label>Gender:</label>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <br><br>

        <label>Father's Name:</label>
        <input type="text" id="father"><br><br>

        <label>Mother's Name:</label>
        <input type="text" id="mother"><br><br>

        <label>Address:</label><br>
        <textarea id="address" rows="4" cols="30"></textarea>
        <br><br>

        <label>Phone Number:</label>
        <input type="tel" id="phone"><br><br>

        <label>Email ID:</label>
        <input type="email" id="email"><br><br>

        <h3>Education Details</h3>

        <table border="1">
            <tr>
                <th>Qualification</th>
                <th>College/School</th>
                <th>Percentage</th>
            </tr>

            <tr>
                <td><input type="text" id="qualification1"></td>
                <td><input type="text" id="college1"></td>
                <td><input type="text" id="percentage1"></td>
            </tr>

            <tr>
                <td><input type="text" id="qualification2"></td>
                <td><input type="text" id="college2"></td>
                <td><input type="text" id="percentage2"></td>
            </tr>
        </table>

        <br>

        <label>Upload Photo:</label>
        <input type="file" id="photo"><br><br>

        <label>Upload Signature:</label>
        <input type="file" id="signature"><br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Reset">

    </form>

    <script src="script.js"></script>

</body>
</html>
